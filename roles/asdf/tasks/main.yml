- name: Check for OS specific settings
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution | lower }}.yml"
  register: custom_settings

- name: Apply OS specific settings
  ansible.builtin.include_tasks:
    "{{ role_path }}/tasks/{{ ansible_distribution | lower }}.yml"
  when: custom_settings.stat.exists

- name: Symlink config
  ansible.builtin.file:
    src: "{{ role_path }}/files/asdfrc"
    dest: "{{ ansible_user_dir }}/.asdfrc"
    state: link
    force: true
