- name: Install updater
  block:
    - name: Install updater
      community.general.pipx:
        name: awscli-update
        state: present
      when: ansible_distribution == "Ubuntu"

    - name: Install updater
      ansible.builtin.pip:
        name: awscli-update
        state: present
      when: ansible_distribution == "Archlinux"

- name: Install awscli
  ansible.builtin.shell: |
    awscli-update -q --prefix "$HOME/.local"
  args:
    creates: "{{ ansible_user_dir }}/.local/bin/aws"

- name: Setup cronjob
  ansible.builtin.cron:
    name: update awscli
    minute: 0
    job: "$HOME/.local/bin/awscli-update -q --prefix $HOME/.local"
    state: present

