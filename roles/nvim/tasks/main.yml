- name: Install
  become: true
  community.general.snap:
    name: "{{ role_name }}"
    classic: true
  when: ansible_distribution == "Ubuntu"

- name: Symlink
  ansible.builtin.file:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_user_dir }}/.config/{{ role_name }}"
    state: link
    force: true
