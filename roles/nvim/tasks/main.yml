- name: Install
  become: true
  block:
    - name: Install
      community.general.snap:
        name: "{{ role_name }}"
        classic: true
      when: ansible_distribution == "Ubuntu"

    - name: Install
      ansible.builtin.package:
        name: neovim
      when: ansible_distribution == "Archlinux"

- name: Symlink
  ansible.builtin.file:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_user_dir }}/.config/{{ role_name }}"
    state: link
    force: true
