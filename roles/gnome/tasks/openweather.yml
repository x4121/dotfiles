- name: Install extension 'openweather'
  ansible.builtin.shell: "{{ ansible_user_dir }}/.bin/gnomeshell-extension-manager --install --extension-id 750"
  args:
    creates: "{{ ansible_user_dir }}/.local/share/gnome-shell/extensions/openweather-extension@jenslody.de/"

- name: Install extension schema
  become: true
  ansible.builtin.shell: |
    cp {{ ansible_user_dir }}/.local/share/gnome-shell/extension/openweather-extension@jenslody.de/schemas/org.gnome.shell.extensions.openweather.gschema.xml
      /usr/share/glib-2.0/schemas/
    glib-compile-schemas /usr/share/glib-2.0/schemas/
  args:
    creates: /usr/share/glib-2.0/schemas/org.gnome.shell.extensions.openweather.gschema.xml

- name: Configure extension
  ansible.builtin.shell: |
    gsettings set org.gnome.shell.extensions.openweather \
      pressure-unit 'hPa'
    gsettings set org.gnome.shell.extensions.openweather \
      unit 'celsius'
    gsettings set org.gnome.shell.extensions.openweather \
      wind-speed-unit 'kph'
    gsettings set org.gnome.shell.extensions.openweather \
      {{ openweather_location }}
