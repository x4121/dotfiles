- name: Install extension 'user themes'
  ansible.builtin.shell: "{{ ansible_user_dir }}/.bin/gnomeshell-extension-manager --install --extension-id 19"
  args:
    creates: "{{ ansible_user_dir }}/.local/share/gnome-shell/extensions/user-theme@gnome-shell-extensions.gcampax.github.com/"

- name: Install extension schema
  become: true
  ansible.builtin.shell: |
    cp {{ ansible_user_dir }}/.local/share/gnome-shell/extension/user-theme@gnome-shell-extensions.gcampax.github.com/schemas/org.gnome.shell.extensions.user-theme.gschema.xml
      /usr/share/glib-2.0/schemas/
    glib-compile-schemas /usr/share/glib-2.0/schemas/
  args:
    creates: /usr/share/glib-2.0/schemas/org.gnome.shell.extensions.user-theme.gschema.xml

- name: Configure extension
  ansible.builtin.shell: |
    gsettings set org.gnome.shell.extensions.user-theme \
      name 'Arc-Dark'
