- name: Install
  become: true
  ansible.builtin.package:
    name:
      - neomutt
      - isync
      - msmtp
      - notmuch
      - notmuch-mutt
      # - urlview
      - w3m

- name: Install python dependencies
  block:
    - name: Install python dependencies
      community.general.pipx:
        name: mutt_ics
        state: present
      tags: debug_mutt
      when: ansible_distribution == "Ubuntu"

    - name: Install python dependencies
      ansible.builtin.pip:
        name: mutt_ics
        state: present
      tags: debug_mutt
      when: ansible_distribution == "Archlinux"

- name: Create mail folder
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/Mail"
    state: directory
    mode: "0700"

- name: Install color scheme
  ansible.builtin.git:
    repo: "https://github.com/shuber2/mutt-gruvbox.git"
    dest: "{{ role_path }}/files/{{ role_name }}/gruvbox"

- name: Symlink config
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ role_name }}"
    dest: "{{ ansible_user_dir }}/.{{ role_name }}"
    state: link
    force: true

- name: "Check for user config"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ user }}.yml"
  register: user_config

- name: Copy user config
  # These should probably be templates
  ansible.builtin.include_tasks: "{{ user }}.yml"
  when: user_config.stat.exists

- name: Setup mbsync timer
  block:
    - name: Copy service
      ansible.builtin.file:
        src: "{{ role_path }}/files/systemd/mbsync.service"
        dest: "{{ ansible_user_dir }}/.config/systemd/user/mbsync.service"
        state: link
        force: true
    - name: Copy timer
      ansible.builtin.file:
        src: "{{ role_path }}/files/systemd/mbsync.timer"
        dest: "{{ ansible_user_dir }}/.config/systemd/user/mbsync.timer"
        state: link
        force: true
    - name: Start timer
      ansible.builtin.service:
        name: mbsync.timer
        state: started
        scope: user
        enabled: true
# symlink mutt/aliases -> Nextcloud/sync/mutt.alias

