- name: Check for OS specific settings
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution | lower }}.yml"
  register: custom_settings

- name: Apply OS specific settings
  ansible.builtin.include_tasks:
    "{{ role_path }}/tasks/{{ ansible_distribution | lower }}.yml"
  when: custom_settings.stat.exists

- name: Symlink config
  ansible.builtin.file:
    src: "{{ role_path }}/files/dual-function-keys.yaml"
    dest: /etc/interception/dual-function-keys.yaml
    state: link
    force: true

- name: Symlink config
  ansible.builtin.file:
    src: "{{ role_path }}/files/udevmon.d"
    dest: /etc/interception/udevmon.d
    state: link
    force: true

- name: Enable service
  ansible.builtin.service:
    name: udevmon
    state: started
